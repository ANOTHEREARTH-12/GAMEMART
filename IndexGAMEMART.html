<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing &amp; Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--txt:#f5f5f7;--mut:rgba(255,255,255,.58);--line:rgba(255,255,255,.12);--glass:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));--good:#7ee2a8;--bad:#ff8f9d}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#050506}
body{font-family:Inter,"SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 520px at 88% 96%,rgba(255,255,255,.07),transparent 60%),radial-gradient(700px 480px at 8% 0%,rgba(255,255,255,.08),transparent 60%),linear-gradient(135deg,#1a1a1d 0%,#070708 55%,#030303 100%)}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);gap:34px;padding:18px;min-height:100vh}
/* sidebar */
.side{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;border-radius:30px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:20px 14px 14px;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 6px}
.logo{width:42px;height:42px;border-radius:14px;background:#f2f2f4;color:#0b0b0c;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none;letter-spacing:-.3px}
.brand b{display:block;font-size:17px;font-weight:700;line-height:1.15;word-break:break-word}
.brand small{color:var(--mut);font-size:12px}
.nav{flex:1;overflow:auto;padding:2px 0 8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.grp{font-size:11px;letter-spacing:.14em;color:var(--mut);padding:16px 12px 8px;text-transform:uppercase;font-weight:600}
.ni{display:flex;align-items:center;gap:12px;padding:4px 10px;border-radius:18px;cursor:pointer;color:rgba(255,255,255,.62);font-weight:600;font-size:15px;border:1px solid transparent;transition:.15s;user-select:none}
.ni:hover{color:#fff;background:rgba(255,255,255,.05)}
.ni.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.1));border-color:rgba(255,255,255,.28)}
.ic{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.ni.on .ic{background:rgba(255,255,255,.2)}
.ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:6px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.07)}
.foot .av{width:36px;height:36px;border-radius:50%;background:#f2f2f4;color:#0b0b0c;display:grid;place-items:center;font-weight:800;flex:none}
.foot b{display:block;font-size:14px;line-height:1.2}
.foot small{color:var(--mut);font-size:12px;line-height:1.3;display:block}
/* main */
main{min-width:0;padding:6px 6px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:28px;font-weight:700;letter-spacing:-.4px}
.sub{color:var(--mut);margin-top:4px;font-size:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));color:#fff;border-radius:999px;padding:11px 18px;font:600 14px Inter,sans-serif;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:.15s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.18)}
.btn.pri{background:#f5f5f7;color:#0b0b0c;border-color:#fff}
.btn.pri:hover{background:#fff}
.btn.sm{padding:7px 13px;font-size:13px}
.fysel{border-radius:999px!important;width:auto!important;padding:10px 14px!important;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:20px}
.stat{border-radius:26px;border:1px solid var(--line);background:var(--glass);padding:18px 20px;min-height:96px;backdrop-filter:blur(14px)}
.stat span{font-size:14px;font-weight:500}
.stat b{display:block;font-size:28px;margin-top:6px;font-weight:700;letter-spacing:-.4px}
.stat small{color:var(--mut);font-size:12px}
.panel{border-radius:32px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));padding:20px;margin-bottom:20px;backdrop-filter:blur(14px)}
.panel h3{font-size:16px;margin-bottom:12px;font-weight:700}
.toolbar{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:220px;position:relative;max-width:420px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round}
.search input{padding-left:40px}
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;border-radius:16px;padding:12px 15px;font:500 14px Inter,sans-serif;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.09)}
select option{background:#1b1b1e;color:#fff}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.35)}
textarea{resize:vertical;min-height:70px}
.toolbar select{width:auto;min-width:190px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;letter-spacing:.07em;color:var(--mut);text-transform:uppercase;font-weight:700;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.025)}
td small{display:block;color:var(--mut);margin-top:3px;font-size:13px}
td b{font-weight:700}
.r{text-align:right!important}
.act{white-space:nowrap;text-align:right}
.act a{cursor:pointer;font-weight:700;margin-left:14px}
.act a:hover{text-decoration:underline}
.act a.del{color:var(--bad)}
.pill{display:inline-block;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);border-radius:999px;padding:3px 12px;font-weight:700;font-size:12px;white-space:nowrap}
.dr{color:var(--good)}.cr{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:36px 0!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 6px 3px;letter-spacing:.03em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:9px 16px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font-weight:600;color:var(--mut)}
.tab.on{background:#f5f5f7;color:#0b0b0c;border-color:#fff}
.st td:last-child,.st th:last-child{text-align:right}
.st tr.h td{font-weight:700;background:rgba(255,255,255,.04);color:#fff}
.st tr.t td{font-weight:800;border-top:1px solid rgba(255,255,255,.3);font-size:15px}
.st td.i{padding-left:26px;color:rgba(255,255,255,.82)}
.bars{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:10px}
.bars div.c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .bar{width:42%;max-width:20px;border-radius:7px 7px 3px 3px;background:#f2f2f4;min-height:2px}
.bars .bar.p{background:rgba(255,255,255,.28)}
.bars small{color:var(--mut);font-size:11px}
.legend{display:flex;gap:16px;color:var(--mut);font-size:12px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:#f2f2f4;margin-right:6px}
.legend i.p{background:rgba(255,255,255,.28)}
.note{color:var(--mut);font-size:13px;line-height:1.55}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.modal{width:min(1020px,100%);border-radius:30px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,#1d1d20,#101012);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 4px}
.mh h2{font-size:21px}
.mb{padding:16px 24px 8px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px 22px}
.x{cursor:pointer;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:20px;line-height:1}
.lines input,.lines select{padding:9px 10px;border-radius:12px;font-size:13px}
.lines table{min-width:820px}
.lines td{padding:6px 4px;border:0}
.lines th{padding:6px 4px}
.tot{margin-left:auto;width:min(360px,100%);margin-top:14px}
.tot div{display:flex;justify-content:space-between;padding:6px 2px;color:rgba(255,255,255,.8)}
.tot div.g{border-top:1px solid rgba(255,255,255,.3);margin-top:6px;padding-top:10px;font-size:18px;font-weight:800;color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f5f5f7;color:#0b0b0c;font-weight:600;padding:12px 20px;border-radius:999px;z-index:99;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lock{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(800px 500px at 50% 30%,#232327,#060607)}
.lock .card{width:min(380px,92vw);padding:34px;border-radius:32px;border:1px solid var(--line);background:var(--glass);text-align:center}
.lock .logo{margin:0 auto 14px;width:54px;height:54px}
.lock h2{margin-bottom:4px}.lock p{color:var(--mut);margin-bottom:18px}
.lock input{text-align:center;letter-spacing:.4em;font-size:18px;margin-bottom:12px}
.mbtn{display:none}
/* paper (invoice) */
.paper{background:#fff;color:#111;border-radius:14px;padding:30px;font-family:Inter,Arial,sans-serif;font-size:12.5px;line-height:1.45}
.paper h2{font-size:24px;letter-spacing:-.3px}
.paper .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:14px}
.paper .ttl{font-size:15px;font-weight:800;letter-spacing:.12em;text-align:right}
.paper .meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.paper .box{border:1px solid #ccc;border-radius:8px;padding:10px 12px}
.paper .box h5{font-size:10px;letter-spacing:.1em;color:#666;margin-bottom:4px;text-transform:uppercase}
.paper table{min-width:0;width:100%;border-collapse:collapse}
.paper th{background:#f0f0f0;color:#111;font-size:10.5px;padding:7px 6px;border:1px solid #ccc;letter-spacing:.03em}
.paper td{padding:7px 6px;border:1px solid #ddd;color:#111;font-size:12px}
.paper tbody tr:hover td{background:none}
.paper .r{text-align:right!important}
.paper .sum{display:flex;justify-content:space-between;gap:20px;margin-top:12px}
.paper .sum .t{width:260px}
.paper .sum .t div{display:flex;justify-content:space-between;padding:3px 0}
.paper .sum .t div.g{border-top:2px solid #111;font-weight:800;font-size:15px;margin-top:4px;padding-top:6px}
.paper .pf{margin-top:22px;padding-top:8px;border-top:1px solid #ccc;text-align:center;color:#777;font-size:10.5px}
#print{display:none}
@media print{
 body:before{display:none}html,body{background:#fff!important}
 .app,.overlay,.toast,.lock{display:none!important}
 #print{display:block!important}
 #print .paper{border-radius:0;padding:0}
 @page{margin:12mm}
}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:900px){
 .app{grid-template-columns:1fr;gap:0;padding:12px}
 .side{position:fixed;z-index:40;left:12px;top:12px;bottom:12px;width:268px;height:auto;transform:translateX(-120%);transition:.25s;background:#17171a}
 .side.open{transform:none}
 .mbtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:20px;cursor:pointer;margin-bottom:12px}
 h1{font-size:23px}
}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:21px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo" id="logo">GM</div><div><b id="brandName">Client</b><small>Billing &amp; Accounts</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><div class="av">K</div><div><b>Powered by KRN Tax</b><small id="saved">Consultancy</small></div></div>
  </aside>
  <main id="main"></main>
</div>
<div id="print"></div>
<div id="layer"></div>
<input type="file" id="file" accept=".json,application/json" style="display:none" onchange="importFile(event)">

<script>
/* ============================================================
   CONFIG — change only this line for each new client repo
   ============================================================ */
const CLIENT_NAME = "GAMEMART";
const FOOTER_BRAND = "KRN Tax Consultancy";

const KEY = "krn_billing_" + CLIENT_NAME.toLowerCase().replace(/[^a-z0-9]/g, "_");
const STATES = ["Andaman and Nicobar Islands","Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chandigarh","Chhattisgarh","Dadra and Nagar Haveli and Daman and Diu","Delhi","Goa","Gujarat","Haryana","Himachal Pradesh","Jammu and Kashmir","Jharkhand","Karnataka","Kerala","Ladakh","Lakshadweep","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Puducherry","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal"];
const GST_RATES = [0, 0.25, 3, 5, 12, 18, 28];
const MODES = ["Cash", "UPI", "Bank Transfer", "Cheque", "Card"];
const HEADS = ["Rent","Salaries","Electricity","Transport","Telephone & Internet","Bank Charges","Repairs & Maintenance","Professional Fees","Office Expenses","Advertisement","Miscellaneous"];
const KIND_LBL = {expense:"Expense", gstpaid:"GST Paid to Govt", capital:"Capital Introduced", drawings:"Drawings"};

const ICON = {
 dash:'<rect x="3" y="3" width="7" height="7" rx="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.8"/>',
 sales:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
 purch:'<path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 016 0"/>',
 rec:'<path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/>',
 pay:'<path d="M12 20V8"/><path d="M7 13l5-5 5 5"/><path d="M5 4h14"/>',
 exp:'<path d="M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path d="M3 7l2-3h12"/><circle cx="16.5" cy="13.5" r="1"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7"/><path d="M18 14.8c1.8.7 3 2.4 3.5 5.2"/>',
 box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
 gst:'<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
 pl:'<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-8"/><path d="M22 20H2"/>',
 bs:'<path d="M12 3v18"/><path d="M5 7h14"/><path d="M5 7l-3 7a3 3 0 006 0L5 7z"/><path d="M19 7l-3 7a3 3 0 006 0l-3-7z"/>',
 db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
 set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'
};
const svg = k => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
const NAV = [
 ["WORKSPACE",[["dashboard","Dashboard","dash"],["sales","Sales","sales"],["purchases","Purchases","purch"],["receipts","Receipts","rec"],["payments","Payments","pay"],["entries","Expenses & Others","exp"],["parties","Parties","users"],["items","Items","box"]]],
 ["REPORTS",[["gst","GST Reports","gst"],["pnl","Profit & Loss","pl"],["bs","Balance Sheet","bs"]]],
 ["DATA",[["backup","Import / Backup","db"],["settings","Settings","set"],["__lock","Lock","lock"]]]
];

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const inr = n => "₹" + (+n || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const fdate = d => d ? d.split("-").reverse().join("-") : "";
const dayBefore = d => new Date(Date.parse(d) - 864e5).toISOString().slice(0, 10);
const inR = (d, a, b) => d >= a && d <= b;
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const pad = (n, l = 3) => String(n).padStart(l, "0");
function words(n) {
  n = Math.round(n); if (n === 0) return "Zero";
  const a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? " " + a[x % 10] : "");
  const three = x => (x > 99 ? a[Math.floor(x / 100)] + " Hundred" + (x % 100 ? " " : "") : "") + (x % 100 ? two(x % 100) : "");
  let o = "";
  const cr = Math.floor(n / 1e7); n %= 1e7; const lk = Math.floor(n / 1e5); n %= 1e5; const th = Math.floor(n / 1e3); n %= 1e3;
  if (cr) o += three(cr) + " Crore "; if (lk) o += two(lk) + " Lakh "; if (th) o += two(th) + " Thousand "; if (n) o += three(n);
  return o.trim();
}
function download(name, text, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: mime || "text/plain"}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function toast(m) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------------- data ---------------- */
let mem = null, lastSaved = null;
function defaults() {
  return {
    settings: {bizName: CLIENT_NAME, gstin: "", pan: "", address: "", state: "Tamil Nadu", phone: "", email: "", bank: "", acc: "", ifsc: "", upi: "", terms: "Goods once sold will not be taken back.\nSubject to local jurisdiction.", pin: "", salePrefix: "INV", purchPrefix: "PUR", openingCash: 0},
    parties: [
      {id: "p_cash_c", name: "Cash Customer", gstin: "", state: "", phone: "", email: "", address: "", openType: "Dr", openAmt: 0},
      {id: "p_cash_s", name: "Cash Supplier", gstin: "", state: "", phone: "", email: "", address: "", openType: "Dr", openAmt: 0}
    ],
    items: [], sales: [], purchases: [], receipts: [], payments: [], entries: []
  };
}
function load() {
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
  return mem ? JSON.parse(mem) : null;
}
let db = load() || defaults();
function save() {
  const s = JSON.stringify(db);
  try { localStorage.setItem(KEY, s); } catch (e) { mem = s; }
  lastSaved = new Date();

const S = () => db.settings;
const P = id => db.parties.find(p => p.id === id);

/* ---------------- financial year ---------------- */
const nowD = new Date();
let fy = nowD.getMonth() >= 3 ? nowD.getFullYear() : nowD.getFullYear() - 1;
const fyRange = () => [fy + "-04-01", (fy + 1) + "-03-31"];
const fyLabel = y => y + "-" + String(y + 1).slice(2);
const defDate = () => { const [a, b] = fyRange(); const t = today(); return inR(t, a, b) ? t : a; };
function setFY(v) { fy = +v; R = null; Q = {}; render(); }
function fySelect() {

  return `<select class="fysel" onchange="setFY(this.value)">${ys.map(y => `<option value="${y}" ${y === fy ? "selected" : ""}>FY ${fyLabel(y)}</option>`).join("")}</select>`;
}

/* ---------------- calculations ---------------- */
function docCalc(d) {
  const intra = (d.pos || S().state) === S().state;
  let taxable = 0, cgst = 0, sgst = 0, igst = 0;
  const lines = (d.lines || []).map(l => {
    const gross = num(l.qty) * num(l.rate);
    const tx = r2(gross * (1 - num(l.disc) / 100));
    const tax = r2(tx * num(l.gst) / 100);
    const c = intra ? r2(tax / 2) : 0, s = intra ? r2(tax - c) : 0, i = intra ? 0 : tax;
    taxable += tx; cgst += c; sgst += s; igst += i;
    return Object.assign({}, l, {taxable: tx, tax, cgst: c, sgst: s, igst: i, amount: r2(tx + tax)});
  });
  taxable = r2(taxable); cgst = r2(cgst); sgst = r2(sgst); igst = r2(igst);
  const tax = r2(cgst + sgst + igst), raw = r2(taxable + tax), total = Math.round(raw);
  return {lines, taxable, cgst, sgst, igst, tax, intra, round: r2(total - raw), total};
}
function stockQty(itemId, upto) {
  const it = db.items.find(i => i.id === itemId); if (!it) return 0;
  let q = num(it.openQty);
  db.purchases.forEach(d => { if (d.date <= upto) d.lines.forEach(l => { if (l.itemId === itemId) q += num(l.qty); }); });
  db.sales.forEach(d => { if (d.date <= upto) d.lines.forEach(l => { if (l.itemId === itemId) q -= num(l.qty); }); });
  return q;
}
const stockValue = upto => r2(sum(db.items, it => Math.max(0, stockQty(it.id, upto)) * num(it.costRate)));
function pBal(pid, upto) {
  upto = upto || "9999-12-31";
  const p = P(pid); if (!p) return 0;
  let b = (p.openType === "Cr" ? -1 : 1) * num(p.openAmt);
  db.sales.forEach(d => { if (d.partyId === pid && d.date <= upto) b += docCalc(d).total; });
  db.purchases.forEach(d => { if (d.partyId === pid && d.date <= upto) b -= docCalc(d).total; });
  db.receipts.forEach(d => { if (d.partyId === pid && d.date <= upto) b -= num(d.amount); });
  db.payments.forEach(d => { if (d.partyId === pid && d.date <= upto) b += num(d.amount); });
  return r2(b);
}
const balTxt = b => `<span class="${b >= 0 ? "dr" : "cr"}">${inr(Math.abs(b))} ${b >= 0 ? "Dr" : "Cr"}</span>`;
function pnl(from, to) {
  const sales = sum(db.sales.filter(d => inR(d.date, from, to)), d => docCalc(d).taxable);
  const purch = sum(db.purchases.filter(d => inR(d.date, from, to)), d => docCalc(d).taxable);
  const open = stockValue(dayBefore(from)), close = stockValue(to);
  const gp = r2(sales + close - open - purch);
  const ex = {};
  db.entries.filter(e => e.kind === "expense" && inR(e.date, from, to)).forEach(e => { ex[e.head] = r2((ex[e.head] || 0) + num(e.amount) - num(e.gst)); });
  const exTotal = r2(sum(Object.values(ex), v => v));
  return {sales: r2(sales), purch: r2(purch), open, close, gp, ex, exTotal, net: r2(gp - exTotal)};
}
function bsheet(asOn) {
  const all = "0000-00-00";
  let cash = num(S().openingCash), intro = 0, draw = 0, gstPaid = 0, inEx = 0, expBase = 0;
  db.receipts.forEach(d => { if (d.date <= asOn) cash += num(d.amount); });
  db.payments.forEach(d => { if (d.date <= asOn) cash -= num(d.amount); });
  db.entries.forEach(e => {
    if (e.date > asOn) return;
    const a = num(e.amount);
    if (e.kind === "expense") { cash -= a; inEx += num(e.gst); expBase += a - num(e.gst); }
    else if (e.kind === "gstpaid") { cash -= a; gstPaid += a; }
    else if (e.kind === "capital") { cash += a; intro += a; }
    else if (e.kind === "drawings") { cash -= a; draw += a; }
  });
  let debt = 0, cred = 0, openNet = 0;
  db.parties.forEach(p => {
    const b = pBal(p.id, asOn); if (b >= 0) debt += b; else cred -= b;
    openNet += (p.openType === "Cr" ? -1 : 1) * num(p.openAmt);
  });
  const stock = stockValue(asOn), stockBase = stockValue(all);
  let outT = 0, inT = inEx, sT = 0, pT = 0;
  db.sales.forEach(d => { if (d.date <= asOn) { const c = docCalc(d); outT += c.tax; sT += c.taxable; } });
  db.purchases.forEach(d => { if (d.date <= asOn) { const c = docCalc(d); inT += c.tax; pT += c.taxable; } });
  const gstNet = r2(outT - inT - gstPaid);
  const openCap = r2(num(S().openingCash) + stockBase + openNet);
  const profit = r2(sT - pT - expBase + stock - stockBase);
  const capital = r2(openCap + profit + intro - draw);
  const liab = [["Capital Account", capital], ["Sundry Creditors", r2(cred)]];
  if (gstNet > 0) liab.push(["GST Payable (net)", gstNet]);
  const assets = [["Cash & Bank", r2(cash)], ["Sundry Debtors", r2(debt)], ["Closing Stock", stock]];
  if (gstNet < 0) assets.push(["GST Input Credit (net)", r2(-gstNet)]);
  const tl = r2(sum(liab, x => x[1])), ta = r2(sum(assets, x => x[1]));
  return {liab, assets, tl, ta, openCap, profit, intro, draw, capital, cash: r2(cash), debt: r2(debt), cred: r2(cred), stock, gstNet};
}

}

}

    return {head: ["Date", "Number", "Party", "GSTIN", "Place of supply", "Taxable", "CGST", "SGST", "IGST", "Total"], rows: rows.concat([tot]), tot: true};
  };
  if (tab === "sales") return reg(S_, true);
  if (tab === "purchases") return reg(P_, false);
  if (tab === "gstr1") {
    const b2b = S_.filter(d => (P(d.partyId) || {}).gstin), b2c = S_.filter(d => !(P(d.partyId) || {}).gstin);
    const rows = [["B2B — registered customers", "", "", "", "", "", "", ""]];
    b2b.forEach(d => { const c = docCalc(d), p = P(d.partyId); rows.push([p.gstin, p.name, d.no, fdate(d.date), c.taxable, c.cgst, c.sgst, c.igst]); });
    const g = {}; b2c.forEach(d => { const c = docCalc(d); c.lines.forEach(l => { const k = l.gst + "|" + (c.intra ? "Intra" : "Inter"); g[k] = g[k] || {gst: l.gst, t: c.intra ? "Intra-state" : "Inter-state", x: 0, c: 0, s: 0, i: 0}; g[k].x += l.taxable; g[k].c += l.cgst; g[k].s += l.sgst; g[k].i += l.igst; }); });
    rows.push(["B2C — unregistered customers (rate-wise)", "", "", "", "", "", "", ""]);
    Object.values(g).sort((a, b) => a.gst - b.gst).forEach(x => rows.push(["", x.t, "GST " + x.gst + "%", "", r2(x.x), r2(x.c), r2(x.s), r2(x.i)]));
    const all = S_.map(docCalc); rows.push(["", "", "TOTAL OUTWARD", "", r2(sum(all, c => c.taxable)), r2(sum(all, c => c.cgst)), r2(sum(all, c => c.sgst)), r2(sum(all, c => c.igst))]);
    return {head: ["GSTIN", "Party / Type", "Invoice / Rate", "Date", "Taxable", "CGST", "SGST", "IGST"], rows, tot: true, sect: true};
  }
  if (tab === "hsn") {
    const g = {};
    S_.forEach(d => docCalc(d).lines.forEach(l => { const k = (l.hsn || "—") + "|" + l.gst; g[k] = g[k] || {h: l.hsn || "—", u: l.unit || "", gst: l.gst, q: 0, x: 0, c: 0, s: 0, i: 0}; g[k].q += num(l.qty); g[k].x += l.taxable; g[k].c += l.cgst; g[k].s += l.sgst; g[k].i += l.igst; }));
    const rows = Object.values(g).sort((a, b) => a.h.localeCompare(b.h)).map(x => [x.h, x.u, x.gst + "%", x.q, r2(x.x), r2(x.c), r2(x.s), r2(x.i)]);
    rows.push(["TOTAL", "", "", "", ...[4, 5, 6, 7].map(i => r2(sum(rows, x => x[i])))]);
    return {head: ["HSN/SAC", "UQC", "Rate", "Qty", "Taxable", "CGST", "SGST", "IGST"], rows, tot: true};
  }
  // 3B
  const o = S_.map(docCalc), p2 = P_.map(docCalc);
  const exGst = sum(db.entries.filter(e => e.kind === "expense" && inR(e.date, r.from, r.to)), e => num(e.gst));
  const paid = sum(db.entries.filter(e => e.kind === "gstpaid" && inR(e.date, r.from, r.to)), e => num(e.amount));
  const oi = r2(sum(o, c => c.igst)), oc = r2(sum(o, c => c.cgst)), os = r2(sum(o, c => c.sgst));
  const ii = r2(sum(p2, c => c.igst)), ic = r2(sum(p2, c => c.cgst) + exGst / 2), is_ = r2(sum(p2, c => c.sgst) + exGst / 2);
  const rows = [
    ["3.1 Outward taxable supplies", r2(sum(o, c => c.taxable)), oi, oc, os],
    ["4. Eligible ITC (purchases + GST on expenses)", r2(sum(p2, c => c.taxable)), ii, ic, is_],
    ["Net tax payable (output − ITC)", "", r2(oi - ii), r2(oc - ic), r2(os - is_)],
    ["Tax already paid to govt in period", "", "", "", paid],
    ["Overall net payable / (credit)", "", "", "", r2(oi + oc + os - ii - ic - is_ - paid)]
  ];
  return {head: ["Description", "Taxable value", "IGST", "CGST", "SGST/UTGST"], rows, tot: false, note: "Simplified summary — IGST credit set-off order and any carried-forward credit must be applied when filing. GST on expenses is split equally between CGST and SGST."};
}

/* ---------------- GitHub live sync ---------------- */
const GH = {k: KEY + "_gh", cfg: null, sha: null, busy: false, dirty: false, pending: false, timer: null,
  load() { try { this.cfg = JSON.parse(localStorage.getItem(this.k)) || null; } catch (e) { this.cfg = null; } return this.cfg; },
  store() { try { if (this.cfg) localStorage.setItem(this.k, JSON.stringify(Object.assign(this.cfg, {sha: this.sha, pending: this.pending}))); else localStorage.removeItem(this.k); } catch (e) {} },
  on() { return !!(this.cfg && this.cfg.token && this.cfg.owner && this.cfg.repo); },
  url() { const c = this.cfg; return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path || "data.json"}`; },
  h() { return {Authorization: "Bearer " + this.cfg.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}; }
};
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\s/g, ""))));
const clock = () => new Date().toLocaleTimeString("en-IN", {hour: "2-digit", minute: "2-digit"});
function ghStatus(m, bad) { $("saved").textContent = m; $("saved").style.color = bad ? "var(--bad)" : ""; }
async function ghGet() {
  const u = GH.url() + "?ref=" + encodeURIComponent(GH.cfg.branch || "main") + "&t=" + Date.now();
  const r = await fetch(u, {headers: GH.h(), cache: "no-store"});
  if (r.status === 404) return {missing: true};
  if (!r.ok) throw new Error("GitHub " + r.status + (r.status === 401 ? " (check token)" : r.status === 403 ? " (token lacks access)" : ""));
  const j = await r.json();
  let text;
  if (j.content) text = unb64(j.content);
  else text = await (await fetch(u, {headers: Object.assign(GH.h(), {Accept: "application/vnd.github.raw+json"}), cache: "no-store"})).text();
  return {sha: j.sha, data: JSON.parse(text)};
}
function applyRemote(g) {
  db = Object.assign(defaults(), g.data); GH.sha = g.sha; GH.pending = false; GH.store();
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { mem = JSON.stringify(db); }
  render(); ghStatus("Synced to GitHub ✓ " + clock());
}
function queueSync() {
  if (!GH.on()) return;
  GH.pending = true; GH.store(); ghStatus("Saving…");
  clearTimeout(GH.timer); GH.timer = setTimeout(ghPush, 1200);
}
async function ghPush() {
  if (!GH.on()) return false;
  if (GH.busy) { GH.dirty = true; return false; }
  GH.busy = true; GH.dirty = false; ghStatus("Syncing to GitHub…");
  let ok = false;
  try {
    const body = {message: "Update " + CLIENT_NAME + " data " + new Date().toISOString(), content: b64(JSON.stringify(db)), branch: GH.cfg.branch || "main"};
    if (GH.sha) body.sha = GH.sha;
    const r = await fetch(GH.url(), {method: "PUT", headers: Object.assign({"Content-Type": "application/json"}, GH.h()), body: JSON.stringify(body)});
    if (r.status === 409 || r.status === 422) {
      const g = await ghGet();
      if (g.missing) { GH.sha = null; GH.dirty = true; }
      else if (confirm("Another device saved newer data to GitHub.\n\nOK = load their version here (changes made here since the last sync are lost).\nCancel = overwrite GitHub with this device's data.")) applyRemote(g);
      else { GH.sha = g.sha; GH.dirty = true; }
    } else {
      if (!r.ok) throw new Error("GitHub " + r.status + (r.status === 401 ? " (check token)" : r.status === 403 || r.status === 404 ? " (token needs Contents: read & write on the data repo)" : ""));
      const j = await r.json(); GH.sha = j.content.sha; GH.pending = false; GH.store(); ok = true;
      ghStatus("Synced to GitHub ✓ " + clock());
    }
  } catch (e) { ghStatus("Sync failed: " + e.message, true); }
  GH.busy = false;
  if (GH.dirty) return ghPush();
  return ok;
}
async function ghPull(manual) {
  if (!GH.on() || GH.busy || GH.pending) return;
  try {
    const g = await ghGet();
    if (g.missing) { await ghPush(); return; }
    if (g.sha !== GH.sha) { applyRemote(g); if (manual) toast("Loaded latest from GitHub"); }
    else { ghStatus("Synced to GitHub ✓ " + clock()); if (manual) toast("Already up to date"); }
  } catch (e) { ghStatus("Sync failed: " + e.message, true); }
}
async function ghConnect() {
  const prev = GH.cfg;
  const cfg = {owner: val("g_owner"), repo: val("g_repo"), branch: val("g_branch") || "main", path: val("g_path") || "data.json", token: val("g_token") || (prev && prev.token) || ""};
  if (!cfg.owner || !cfg.repo || !cfg.token) return toast("Enter owner, repository and token");
  GH.cfg = cfg; GH.sha = null; GH.pending = false; ghStatus("Connecting…");
  try {
    const g = await ghGet();
    if (g.missing) {
      if (!(await ghPush())) throw new Error("could not write — token needs Contents: read & write");
    } else {
      const local = db.sales.length + db.purchases.length + db.receipts.length + db.payments.length + db.entries.length + db.items.length + db.parties.length > 2;
      if (local && !confirm("GitHub already has saved data.\n\nOK = load GitHub's data here (replaces this browser's data).\nCancel = overwrite GitHub with this browser's data.")) { GH.sha = g.sha; if (!(await ghPush())) throw new Error("could not write — token needs Contents: read & write"); }
      else applyRemote(g);
    }
    GH.store(); toast("Connected to GitHub"); render();
    if (!GH.poll) { GH.poll = true; setInterval(() => { if (!$("layer").innerHTML) ghPull(); }, 45000); }
  } catch (e) { GH.cfg = prev; ghStatus("Sync failed: " + e.message, true); toast("Could not connect: " + e.message); }
}
function ghDisconnect() {
  if (!confirm("Disconnect GitHub sync on this device? Your data stays here and on GitHub.")) return;
  GH.cfg = null; GH.store(); $("saved").style.color = ""; $("saved").textContent = "Consultancy"; render(); toast("Disconnected");
}
function ghPanel() {
  const c = GH.cfg || {};
  return `<div class="panel"><h3>GitHub live sync ${GH.on() ? '<span class="pill">Connected</span>' : ""}</h3><p class="note" style="margin-bottom:14px">Every change is saved to a <b>private</b> GitHub repository and loaded on every device that connects. Create a fine-grained token (GitHub → Settings → Developer settings → Fine-grained tokens) limited to that one repository with <b>Contents: Read and write</b>. The token stays only in this browser and is never saved in the data or backups.</p><div class="grid">${fld("Owner / username", `<input id="g_owner" value="${esc(c.owner || "")}" placeholder="github-username">`)}${fld("Data repository (private)", `<input id="g_repo" value="${esc(c.repo || "")}" placeholder="GAMEMART-data">`)}${fld("Branch", `<input id="g_branch" value="${esc(c.branch || "main")}">`)}${fld("File path", `<input id="g_path" value="${esc(c.path || "data.json")}">`)}${fld("Access token", `<input type="password" id="g_token" autocomplete="new-password" placeholder="${GH.on() ? "saved on this device — leave blank to keep" : "github_pat_…"}">`, "full")}</div><div class="acts" style="margin-top:14px">${btn(GH.on() ? "Update connection" : "Connect & sync", "ghConnect()", true)}${GH.on() ? btn("Sync now", "ghPull(true)") + btn("Disconnect", "ghDisconnect()") : ""}</div></div>`;
}
async function initSync() {
  GH.load(); if (!GH.on()) return;
  GH.sha = GH.cfg.sha || null; GH.pending = !!GH.cfg.pending;
  if (GH.pending) await ghPush(); else await ghPull();
  if (S().pin && !$("lockscr")) showLock();
  GH.poll = true; setInterval(() => { if (!$("layer").innerHTML) ghPull(); }, 45000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("layer").innerHTML) ghPull(); });
}
window.addEventListener("beforeunload", e => { if (GH.on() && GH.pending) { e.preventDefault(); e.returnValue = ""; } });

/* ---------------- boot ---------------- */
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("layer").innerHTML) closeModal(); });
$("saved").textContent = "Consultancy";
render();
if (S().pin) showLock();
initSync();
</script>
</body>
</html>
