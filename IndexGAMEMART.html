<style>

<div id="app"><aside id="side"></aside><main><div class="top noprint" id="top"></div><div class="page" id="main"></div></main></div>

<script>
'use strict';
/* ===================== utils ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const r2=n=>Math.round((+n||0)*100)/100;
const fmt=n=>{n=r2(n);const neg=n<0;const [i,d]=Math.abs(n).toFixed(2).split('.');let last=i.slice(-3),rest=i.slice(0,-3);if(rest)last=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+last;return(neg?'-':'')+last+'.'+d};
const z=n=>r2(n)?fmt(n):'';
const drcr=n=>{n=r2(n);return n>0?fmt(n)+' Dr':n<0?fmt(-n)+' Cr':'0.00'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const dmy=d=>d?d.slice(8)+'-'+d.slice(5,7)+'-'+d.slice(0,4):'';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fyOf=d=>{const y=+d.slice(0,4),m=+d.slice(5,7),s=m>=4?y:y-1;return s+'-'+String(s+1).slice(2)};
const fyRange=f=>{const s=+f.slice(0,4);return{start:s+'-04-01',end:(s+1)+'-03-31'}};
const fyPrev=f=>{const s=+f.slice(0,4)-1;return s+'-'+String(s+1).slice(2)};
const fyNext=f=>{const s=+f.slice(0,4)+1;return s+'-'+String(s+1).slice(2)};
const fyList=(a,b)=>{const o=[];let f=a;while(f<=b){o.push(f);f=fyNext(f)}return o};
const monthsOf=f=>{const s=+f.slice(0,4);return Array.from({length:12},(_,i)=>{const m=(3+i)%12+1,y=m>=4?s:s+1;return{key:y+'-'+String(m).padStart(2,'0'),label:MON[m-1]+' '+y}})};
const monthRange=k=>{const[y,m]=k.split('-').map(Number);const e=new Date(y,m,0).getDate();return{start:k+'-01',end:k+'-'+String(e).padStart(2,'0')}};
const STATES={'01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh','05':'Uttarakhand','06':'Haryana','07':'Delhi','08':'Rajasthan','09':'Uttar Pradesh','10':'Bihar','11':'Sikkim','12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura','17':'Meghalaya','18':'Assam','19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh','23':'Madhya Pradesh','24':'Gujarat','26':'Dadra & Nagar Haveli and Daman & Diu','27':'Maharashtra','29':'Karnataka','30':'Goa','31':'Lakshadweep','32':'Kerala','33':'Tamil Nadu','34':'Puducherry','35':'Andaman & Nicobar Islands','36':'Telangana','37':'Andhra Pradesh','38':'Ladakh','97':'Other Territory'};
const stateOpts=sel=>Object.entries(STATES).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${k} - ${v}</option>`).join('');
function words(n){n=Math.round(n);if(!n)return'Zero';const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');let s='';const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;if(cr)s+=three(cr)+' Crore ';if(lk)s+=three(lk)+' Lakh ';if(th)s+=three(th)+' Thousand ';if(n)s+=three(n);return s.trim()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportSheets(fname,sheets){
  if(window.XLSX){const wb=XLSX.utils.book_new();sheets.forEach(s=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s.aoa),s.name.replace(/[\\\/?*\[\]:]/g,'').slice(0,31)||'Sheet'));XLSX.writeFile(wb,fname+'.xlsx')}
  else{const csv=sheets[0].aoa.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');download(fname+'.csv',csv,'text/csv');toast('Excel library not loaded (offline?) - exported CSV')}
}

/* ===================== database ===================== */
const KEY='krn_billing_v1';
let DB=null,REV=0,CUR={title:'Report',aoa:[]};
function save(){REV++;if(typeof SESSION!=='undefined'&&SESSION)queuePersist()}
const C=()=>DB.companies[DB.active];
const FYS=()=>DB.fy;
const MC=new Map();
function memo(k,fn){if(MC.rev!==REV){MC.clear();MC.rev=REV}if(!MC.has(k))MC.set(k,fn());return MC.get(k)}

/* ===================== chart of accounts ===================== */
const GROUPS={'Capital Account':{n:'L'},'Loans (Liability)':{n:'L'},'Current Liabilities':{n:'L'},'Sundry Creditors':{n:'L'},'Duties & Taxes':{n:'L'},
 'Fixed Assets':{n:'A'},'Investments':{n:'A'},'Current Assets':{n:'A'},'Sundry Debtors':{n:'A'},'Cash-in-Hand':{n:'A'},'Bank Accounts':{n:'A'},
 'Sales Accounts':{n:'I'},'Purchase Accounts':{n:'E'},'Direct Expenses':{n:'E'},'Indirect Expenses':{n:'E'},'Indirect Incomes':{n:'I'}};
const isNom=g=>'IE'.includes(GROUPS[g]?.n||'A');
function defaultAccounts(){const A=(id,name,group,sys=1)=>({id,name,group,opening:0,ot:'Dr',sys});
 return[A('cash','Cash','Cash-in-Hand'),A('bank','Bank Account','Bank Accounts'),
 A('sales','Sales','Sales Accounts'),A('sales_ret','Sales Returns','Sales Accounts'),A('purchases','Purchases','Purchase Accounts'),A('pur_ret','Purchase Returns','Purchase Accounts'),
 A('out_cgst','Output CGST','Duties & Taxes'),A('out_sgst','Output SGST','Duties & Taxes'),A('out_igst','Output IGST','Duties & Taxes'),
 A('in_cgst','Input CGST','Duties & Taxes'),A('in_sgst','Input SGST','Duties & Taxes'),A('in_igst','Input IGST','Duties & Taxes'),
 A('tds_rec','TDS Receivable','Current Assets'),A('tds_pay','TDS Payable','Current Liabilities'),A('roundoff','Round Off','Indirect Expenses'),A('capital','Capital Account','Capital Account'),
 A('freight','Freight & Carriage Inward','Direct Expenses',0),A('wages','Wages','Direct Expenses',0),
 A('rent','Rent','Indirect Expenses',0),A('salary','Salaries','Indirect Expenses',0),A('elec','Electricity','Indirect Expenses',0),A('tel','Telephone & Internet','Indirect Expenses',0),
 A('prof','Professional Fees','Indirect Expenses',0),A('office','Office Expenses','Indirect Expenses',0),A('travel','Travelling & Conveyance','Indirect Expenses',0),
 A('bankchg','Bank Charges','Indirect Expenses',0),A('interest','Interest Paid','Indirect Expenses',0),A('dep','Depreciation','Indirect Expenses',0),A('misc','Miscellaneous Expenses','Indirect Expenses',0),
 A('intinc','Interest Received','Indirect Incomes',0),A('othinc','Other Income','Indirect Incomes',0),A('fa_comp','Computers & Equipment','Fixed Assets',0)]}
const TYPES={sales:{name:'Sales Invoice',pre:'INV'},purchase:{name:'Purchase Bill',pre:'PUR'},cn:{name:'Credit Note',pre:'CN'},dn:{name:'Debit Note',pre:'DN'},receipt:{name:'Receipt',pre:'RCT'},payment:{name:'Payment',pre:'PAY'},expense:{name:'Expense',pre:'EXP'},journal:{name:'Journal',pre:'JV'},contra:{name:'Contra',pre:'CTR'}};
const GSTR=[0,0.25,3,5,12,18,28,40];

function newCompany(o){const id='c'+uid();const c={id,name:o.name,type:o.type||'Proprietorship',pan:(o.pan||'').toUpperCase(),gstin:(o.gstin||'').toUpperCase(),gstReg:!!o.gstReg,state:o.state||'33',address:o.address||'',phone:'',email:'',
 bank:{name:'',ac:'',ifsc:'',upi:''},firstFY:o.firstFY,openingStock:+o.openingStock||0,stock:{},accounts:defaultAccounts(),parties:[],items:[],vouchers:[],created:Date.now()};
 DB.companies[id]=c;DB.active=id;DB.fy=fyOf(today())<c.firstFY?c.firstFY:fyOf(today());save();return c}

/* ===================== lookups ===================== */
const amap=c=>memo('am'+c.id,()=>Object.fromEntries(c.accounts.map(a=>[a.id,a])));
const accName=(c,id)=>amap(c)[id]?.name||'(deleted)';
const party=(c,id)=>c.parties.find(p=>p.id===id);
function nextNo(c,type,fy){const pre=TYPES[type].pre;let mx=0;c.vouchers.forEach(v=>{if(v.type===type&&fyOf(v.date)===fy){const m=/(\d+)$/.exec(v.no||'');if(m)mx=Math.max(mx,+m[1])}});return pre+'-'+String(mx+1).padStart(3,'0')}

/* ===================== GST calc ===================== */
function calc(c,v){
  const intra=v.inter!==undefined?!v.inter:((v.pos||c.state)===c.state);
  const reg=c.gstReg;const T={lines:[],taxable:0,cgst:0,sgst:0,igst:0,intra};
  (v.lines||[]).forEach(l=>{
    const gross=(+l.qty||0)*(+l.rate||0),taxable=r2(gross-gross*((+l.disc||0)/100));
    const rate=reg?(+l.gst||0):0;let cg=0,sg=0,ig=0;
    if(intra){cg=r2(taxable*rate/200);sg=cg}else ig=r2(taxable*rate/100);
    T.lines.push({...l,taxable,gr:rate,cgst:cg,sgst:sg,igst:ig,total:r2(taxable+cg+sg+ig)});
    T.taxable+=taxable;T.cgst+=cg;T.sgst+=sg;T.igst+=ig});
  ['taxable','cgst','sgst','igst'].forEach(k=>T[k]=r2(T[k]));
  T.gross=r2(T.taxable+T.cgst+T.sgst+T.igst);
  T.total=(v.noRound||['expense'].includes(v.type))?T.gross:Math.round(T.gross);T.round=r2(T.total-T.gross);return T}
const calcExp=(c,v)=>calc(c,{lines:[{qty:1,rate:+v.amount||0,gst:v.gst}],inter:!!v.inter,noRound:true,type:'expense'});

/* ===================== voucher -> ledger entries ===================== */
function vEntries(c,v){
  const E=[],add=(acc,dr,cr)=>{dr=r2(dr);cr=r2(cr);if((dr||cr)&&acc)E.push({acc,dr,cr})};
  const taxOut=T=>{add('out_cgst',0,T.cgst);add('out_sgst',0,T.sgst);add('out_igst',0,T.igst)};
  const taxOutDr=T=>{add('out_cgst',T.cgst,0);add('out_sgst',T.sgst,0);add('out_igst',T.igst,0)};
  const taxIn=T=>{add('in_cgst',T.cgst,0);add('in_sgst',T.sgst,0);add('in_igst',T.igst,0)};
  const taxInCr=T=>{add('in_cgst',0,T.cgst);add('in_sgst',0,T.sgst);add('in_igst',0,T.igst)};
  const ro=(T,drWhenPos)=>drWhenPos?add('roundoff',T.round>0?T.round:0,T.round<0?-T.round:0):add('roundoff',T.round<0?-T.round:0,T.round>0?T.round:0);
  switch(v.type){
   case'sales':{const T=calc(c,v);add(v.partyId,T.total,0);add(v.ledger||'sales',0,T.taxable);taxOut(T);ro(T,false);break}
   case'cn':{const T=calc(c,v);add(v.partyId,0,T.total);add(v.ledger||'sales_ret',T.taxable,0);taxOutDr(T);ro(T,true);break}
   case'purchase':{const T=calc(c,v);const itc=v.itc!==false;add(v.partyId,0,T.total);add(v.ledger||'purchases',T.taxable+(itc?0:T.cgst+T.sgst+T.igst),0);if(itc)taxIn(T);ro(T,true);break}
   case'dn':{const T=calc(c,v);const itc=v.itc!==false;add(v.partyId,T.total,0);add(v.ledger||'pur_ret',0,T.taxable+(itc?0:T.cgst+T.sgst+T.igst));if(itc)taxInCr(T);ro(T,false);break}
   case'receipt':{const a=+v.amount||0,t=+v.tds||0;add(v.modeAcc||'bank',a-t,0);add('tds_rec',t,0);add(v.accId,0,a);break}
   case'payment':{const a=+v.amount||0,t=+v.tds||0;add(v.accId,a,0);add(v.modeAcc||'bank',0,a-t);add('tds_pay',0,t);break}
   case'expense':{const T=calcExp(c,v),itc=v.itc!==false;add(v.ledger,T.taxable+(itc?0:T.cgst+T.sgst+T.igst),0);if(itc)taxIn(T);add(v.modeAcc||'cash',0,T.total);break}
   case'contra':add(v.to,+v.amount||0,0);add(v.from,0,+v.amount||0);break;
   case'journal':(v.lines||[]).forEach(l=>add(l.acc,+l.dr||0,+l.cr||0));break}
  return E}
const ENT=c=>memo('ent'+c.id,()=>{const o=[];c.vouchers.forEach((v,i)=>vEntries(c,v).forEach(e=>o.push({...e,date:v.date,vid:v.id,type:v.type,no:v.no,narr:v.narr||'',i})));o.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.i-b.i);return o});
const EV=c=>memo('ev'+c.id,()=>{const m={};ENT(c).forEach(e=>(m[e.vid]=m[e.vid]||[]).push(e));return m});
const vTotal=(c,v)=>{if(['sales','purchase','cn','dn'].includes(v.type))return calc(c,v).total;if(v.type==='expense')return calcExp(c,v).total;if(v.type==='journal')return r2((v.lines||[]).reduce((s,l)=>s+(+l.dr||0),0));return+v.amount||0};
const vParty=(c,v)=>{if(v.partyId)return accName(c,v.partyId);if(v.type==='receipt'||v.type==='payment')return accName(c,v.accId);if(v.type==='expense')return accName(c,v.ledger);if(v.type==='contra')return accName(c,v.from)+' → '+accName(c,v.to);return v.narr||''};

/* ===================== reports engine ===================== */
function TB(c,fy){return memo('tb'+c.id+fy,()=>{const{start,end}=fyRange(fy),m={};
  c.accounts.forEach(a=>m[a.id]={a,open:isNom(a.group)?0:(a.ot==='Cr'?-1:1)*(+a.opening||0),dr:0,cr:0});
  ENT(c).forEach(e=>{const t=m[e.acc];if(!t||e.date>end)return;if(e.date<start){if(!isNom(t.a.group))t.open+=e.dr-e.cr}else{t.dr+=e.dr;t.cr+=e.cr}});
  Object.values(m).forEach(t=>{t.open=r2(t.open);t.dr=r2(t.dr);t.cr=r2(t.cr);t.close=r2(t.open+t.dr-t.cr)});return m})}
const stockClose=(c,fy)=>+(c.stock||{})[fy]||0;
const stockOpen=(c,fy)=>fy===c.firstFY?(+c.openingStock||0):stockClose(c,fyPrev(fy));
const sum=a=>r2(a.reduce((s,x)=>s+x.amt,0));
function PL(c,fy){return memo('pl'+c.id+fy,()=>{const tb=TB(c,fy);
  const by=(g,sgn)=>c.accounts.filter(a=>a.group===g).map(a=>({id:a.id,name:a.name,amt:r2(sgn*(tb[a.id].dr-tb[a.id].cr))})).filter(x=>x.amt);
  const sales=by('Sales Accounts',-1),purch=by('Purchase Accounts',1),dexp=by('Direct Expenses',1),iexp=by('Indirect Expenses',1),iinc=by('Indirect Incomes',-1);
  const o=stockOpen(c,fy),cl=stockClose(c,fy);const dr=r2(o+sum(purch)+sum(dexp)),cr=r2(sum(sales)+cl);const gp=r2(cr-dr);const np=r2(gp+sum(iinc)-sum(iexp));
  return{sales,purch,dexp,iexp,iinc,open:o,close:cl,tSales:sum(sales),tPurch:sum(purch),tDexp:sum(dexp),tIexp:sum(iexp),tIinc:sum(iinc),gp,np,dr,cr}})}
const priorProfit=(c,fy)=>r2(fyList(c.firstFY,fyPrev(fy)).reduce((s,f)=>s+PL(c,f).np,0));
const BSORD=['Capital Account','Profit & Loss','Loans (Liability)','Current Liabilities','Sundry Creditors','Duties & Taxes','Difference','Fixed Assets','Investments','Stock-in-Hand','Sundry Debtors','Cash & Bank','Current Assets'];
function BS(c,fy){return memo('bs'+c.id+fy,()=>{const tb=TB(c,fy),pl=PL(c,fy);const S={L:{},A:{}};
  const put=(side,key,label,item,agg)=>{const s=S[side][key+'|'+label]=S[side][key+'|'+label]||{key,label,items:[],agg:!!agg,total:0};s.items.push(item);s.total=r2(s.total+item.amt)};
  c.accounts.forEach(a=>{if(isNom(a.group))return;const b=tb[a.id].close;if(!b)return;const side=b>0?'A':'L',nat=GROUPS[a.group].n;
    let key=a.group,label=a.group;if(key==='Cash-in-Hand'||key==='Bank Accounts'){key='Cash & Bank';label='Cash & Bank'}
    if(nat!==side)label=a.group+(side==='L'?' (credit balances)':' (debit balances)');
    put(side,key,label,{id:a.id,name:a.name,amt:Math.abs(b)},['Sundry Debtors','Sundry Creditors'].includes(a.group))});
  const pp=priorProfit(c,fy);
  if(pp)put('L','Profit & Loss','Profit & Loss A/c',{name:'Profit/(Loss) brought forward',amt:pp});
  if(pl.np)put('L','Profit & Loss','Profit & Loss A/c',{name:'Net Profit/(Loss) for the year',amt:pl.np});
  if(pl.close)put('A','Stock-in-Hand','Stock-in-Hand',{name:'Closing Stock',amt:pl.close});
  const ord=o=>Object.values(o).sort((a,b)=>BSORD.indexOf(a.key)-BSORD.indexOf(b.key));
  let L=ord(S.L),A=ord(S.A);let tL=r2(L.reduce((s,x)=>s+x.total,0)),tA=r2(A.reduce((s,x)=>s+x.total,0));const diff=r2(tA-tL);
  if(diff>0){L.push({key:'Difference',label:'Difference in Opening Balances',items:[{name:'Difference in Opening Balances',amt:diff}],total:diff});tL=r2(tL+diff)}
  else if(diff<0){A.push({key:'Difference',label:'Difference in Opening Balances',items:[{name:'Difference in Opening Balances',amt:-diff}],total:-diff});tA=r2(tA-diff)}
  return{L,A,tL,tA,diff}})}

/* ledger / outstanding */
function ledgerData(c,accId,fy,from,to){const tb=TB(c,fy),t=tb[accId];if(!t)return null;const{start}=fyRange(fy);let open=t.open;const rows=[];
  ENT(c).forEach(e=>{if(e.acc!==accId||e.date<start||e.date>to)return;if(e.date<from)open=r2(open+e.dr-e.cr);else rows.push(e)});
  let bal=open;const out=rows.map(e=>{bal=r2(bal+e.dr-e.cr);const oth=(EV(c)[e.vid]||[]).filter(x=>x.acc!==accId).map(x=>accName(c,x.acc));return{...e,bal,part:oth.length>2?oth[0]+' & others':oth.join(', ')}});
  return{open,rows:out,close:bal,dr:r2(rows.reduce((s,e)=>s+e.dr,0)),cr:r2(rows.reduce((s,e)=>s+e.cr,0))}}
function outstanding(c,fy,kind){const end=fyRange(fy).end,asOf=today()<end?today():end,grp=kind==='dr'?'Sundry Debtors':'Sundry Creditors',sg=kind==='dr'?1:-1,res=[];
  const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
  c.accounts.filter(a=>a.group===grp).forEach(a=>{const bills=[];let set=0;const ob=(a.ot==='Cr'?-1:1)*(+a.opening||0)*sg;
    if(ob>0)bills.push({date:fyRange(c.firstFY).start,ref:'Opening balance',amt:ob});else set+=-ob;
    ENT(c).forEach(e=>{if(e.acc!==a.id||e.date>end)return;const d=(e.dr-e.cr)*sg;if(d>0)bills.push({date:e.date,ref:e.no,amt:d});else set+=-d});
    bills.forEach(b=>{const u=Math.min(b.amt,set);b.pending=r2(b.amt-u);set=r2(set-u);b.age=days(b.date,asOf)});
    const pend=bills.filter(b=>b.pending>0),adv=r2(set),bk=[0,0,0,0];
    pend.forEach(b=>{bk[b.age<=30?0:b.age<=60?1:b.age<=90?2:3]+=b.pending});
    const total=r2(pend.reduce((s,b)=>s+b.pending,0)-adv);if(total||adv)res.push({acc:a,total,bk:bk.map(r2),adv,bills:pend})});
  return{rows:res.sort((x,y)=>y.total-x.total),asOf}}

/* GST docs */
function gdocs(c,from,to){const out=[];c.vouchers.forEach(v=>{if(v.date<from||v.date>to)return;
  if(['sales','cn','purchase','dn'].includes(v.type)){const T=calc(c,v),p=party(c,v.partyId);out.push({v,type:v.type,no:v.no,ref:v.refNo||'',date:v.date,party:p?.name||'',gstin:p?.gstin||'',pos:v.pos||p?.state||c.state,T,dir:v.type==='sales'||v.type==='cn'?'out':'in',sign:v.type==='sales'||v.type==='purchase'?1:-1,itc:v.itc!==false})}
  else if(v.type==='expense'&&c.gstReg&&+v.gst>0){const T=calcExp(c,v);out.push({v,type:'expense',no:v.no,ref:v.refNo||'',date:v.date,party:accName(c,v.ledger),gstin:'',pos:v.inter?'99':c.state,T,dir:'in',sign:1,itc:v.itc!==false})}});
  return out}
function gstr3b(c,from,to){const d=gdocs(c,from,to),o={tx:0,nil:0,cgst:0,sgst:0,igst:0},i={cgst:0,sgst:0,igst:0,taxable:0};
  d.forEach(x=>{if(x.dir==='out'){const nil=x.T.lines.filter(l=>!l.gr).reduce((s,l)=>s+l.taxable,0);o.nil+=x.sign*nil;o.tx+=x.sign*(x.T.taxable-nil);o.cgst+=x.sign*x.T.cgst;o.sgst+=x.sign*x.T.sgst;o.igst+=x.sign*x.T.igst}
   else if(x.itc){i.cgst+=x.sign*x.T.cgst;i.sgst+=x.sign*x.T.sgst;i.igst+=x.sign*x.T.igst;i.taxable+=x.sign*x.T.taxable}});
  Object.keys(o).forEach(k=>o[k]=r2(o[k]));Object.keys(i).forEach(k=>i[k]=r2(i[k]));
  const net={cgst:r2(o.cgst-i.cgst),sgst:r2(o.sgst-i.sgst),igst:r2(o.igst-i.igst)};net.total=r2(net.cgst+net.sgst+net.igst);return{o,i,net,docs:d}}

   Object.assign(v,preset||{})}

function accSelect(c,attr,filter,sel,blank='— select —'){const gs={};c.accounts.filter(filter).forEach(a=>(gs[a.group]=gs[a.group]||[]).push(a));

function formBody(c,v){const t=v.type,I=(f,ty='text',ex='')=>`<input type="${ty}" data-f="${f}" value="${esc(v[f]??'')}" ${ex}>`;

    <div><label>TDS ${rc?'deducted by payer':'deducted by you'}</label>${I('tds','number','step="0.01"')}</div><div><label>Ref / cheque / UTR</label>${I('ref')}</div><div class="w2"><label>Narration (e.g. against invoice no.)</label>${I('narr')}</div></div><div class="tot-panel" id="tp"></div>`}
  if(t==='expense')return`<div class="f"><div class="w2"><label>Expense ledger *</label>${accSelect(c,'data-f="ledger"',inG('Direct Expenses','Indirect Expenses','Fixed Assets'),v.ledger)}</div>${head}
    <div><label>Amount before GST *</label>${I('amount','number','step="0.01"')}</div>${c.gstReg?`<div><label>GST %</label><select data-f="gst">${GSTR.map(r=>`<option${+v.gst===r?' selected':''}>${r}</option>`).join('')}</select></div>
    <div style="padding-top:18px"><label style="display:flex;gap:6px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto" data-f="inter" ${v.inter?'checked':''}> Inter-state (IGST)</label><label style="display:flex;gap:6px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto" data-f="itc" ${v.itc!==false?'checked':''}> Eligible for ITC</label></div>`:''}

  if(t==='contra')return`<div class="f"><div><label>From (credit)</label>${accSelect(c,'data-f="from"',inG('Cash-in-Hand','Bank Accounts'),v.from,'')}</div><div><label>To (debit)</label>${accSelect(c,'data-f="to"',inG('Cash-in-Hand','Bank Accounts'),v.to,'')}</div>${head}<div><label>Amount *</label>${I('amount','number','step="0.01"')}</div><div class="w2"><label>Narration</label>${I('narr')}</div></div>`;

function linesHTML(c,v){const g=c.gstReg;return`<div class="tw"><table style="min-width:820px"><thead><tr><th style="min-width:200px">Item / description</th><th>HSN/SAC</th><th class="n">Qty</th><th>Unit</th><th class="n">Rate</th><th class="n">Disc %</th>${g?'<th>GST %</th>':''}<th class="n">Amount</th><th></th></tr></thead><tbody>
 ${v.lines.map((l,i)=>`<tr><td><input list="dl-items" data-l="${i}.desc" value="${esc(l.desc)}" placeholder="Type or pick item"></td><td style="width:100px"><input data-l="${i}.hsn" value="${esc(l.hsn)}"></td><td style="width:80px"><input type="number" step="any" data-l="${i}.qty" value="${esc(l.qty)}"></td><td style="width:70px"><input data-l="${i}.unit" value="${esc(l.unit)}"></td><td style="width:110px"><input type="number" step="any" data-l="${i}.rate" value="${esc(l.rate)}"></td><td style="width:70px"><input type="number" step="any" data-l="${i}.disc" value="${esc(l.disc)}"></td>${g?`<td style="width:80px"><select data-l="${i}.gst">${GSTR.map(r=>`<option${+l.gst===r?' selected':''}>${r}</option>`).join('')}</select></td>`:''}<td class="n" id="lt${i}" style="width:110px">0.00</td><td><button class="sm dng" onclick="rmLine(${i})">✕</button></td></tr>`).join('')}</tbody></table></div>
 <datalist id="dl-items">${c.items.map(i=>`<option value="${esc(i.name)}">`).join('')}</datalist><button class="sm" style="margin-top:6px" onclick="addLine()">+ Add line</button>`}
function drawForm(){const c=C(),v=F;FM.firstChild.innerHTML=`<h3>${v.id?'Edit':'New'} ${TYPES[v.type].name}</h3>${formBody(c,v)}<div class="foot"><button onclick="closeModal(FM)">Cancel</button><button class="pri" onclick="saveV(0)">Save</button>${v.type==='sales'?'<button class="pri" onclick="saveV(1)">Save &amp; Print</button>':''}</div>`;refreshTotals()}
function addLine(){F.lines.push(F.type==='journal'?{acc:'',dr:'',cr:''}:blankLine());drawForm()}
function rmLine(i){if(F.lines.length<=1&&INV.includes(F.type))return;F.lines.splice(i,1);drawForm()}
function fInput(e){const el=e.target;if(el.dataset.f){F[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;refreshTotals()}else if(el.dataset.l){const[i,k]=el.dataset.l.split('.');F.lines[+i][k]=el.value;refreshTotals()}}
function fChange(e){const el=e.target,c=C();
  if(el.dataset.l&&el.dataset.l.endsWith('.desc')){const i=+el.dataset.l.split('.')[0],it=c.items.find(x=>x.name.toLowerCase()===el.value.trim().toLowerCase());

function refreshTotals(){const c=C(),v=F,t=v.type,el=$('#tp',FM);if(!el)return;const row=(a,b,cl='')=>`<div class="${cl}"><span>${a}</span><span>${b}</span></div>`;
  if(INV.includes(t)){const T=calc(c,v);T.lines.forEach((l,i)=>{const e=$('#lt'+i,FM);if(e)e.textContent=fmt(l.total)});
   el.innerHTML=row('Taxable value',fmt(T.taxable))+(c.gstReg?(T.intra?row('CGST',fmt(T.cgst))+row('SGST',fmt(T.sgst)):row('IGST',fmt(T.igst))):'')+row('Round off',fmt(T.round))+row('Total',fmt(T.total),'gt')}
  else if(t==='expense'){const T=calcExp(c,v);el.innerHTML=row('Amount',fmt(T.taxable))+(c.gstReg?row('GST',fmt(T.cgst+T.sgst+T.igst)):'')+row('Total paid',fmt(T.total),'gt')}
  else if(t==='receipt'||t==='payment'){const a=+v.amount||0,tds=+v.tds||0;el.innerHTML=row('Gross settled',fmt(a))+row('TDS',fmt(tds))+row(t==='receipt'?'Cash/bank received':'Cash/bank paid',fmt(a-tds),'gt')}
  else if(t==='journal'){const d=r2(v.lines.reduce((s,l)=>s+(+l.dr||0),0)),k=r2(v.lines.reduce((s,l)=>s+(+l.cr||0),0));el.innerHTML=row('Total debit',fmt(d))+row('Total credit',fmt(k))+row('Difference',fmt(d-k),'gt')}}
function validate(c,v){const t=v.type;if(!v.date)return'Enter a date';if(fyOf(v.date)<c.firstFY)return'Date is before the books start ('+c.firstFY+')';if(!v.no)return'Enter a voucher number';
  const dup=c.vouchers.find(x=>x.type===t&&x.no===v.no&&x.id!==v.id&&fyOf(x.date)===fyOf(v.date));if(dup&&['sales','cn','dn','receipt','payment','expense','journal','contra'].includes(t))return'Voucher number '+v.no+' already exists in this FY';
  if(INV.includes(t)){if(!v.partyId)return'Select a party';if(!calc(c,v).taxable)return'Add at least one line with quantity and rate';if(!v.ledger)return'Select a ledger'}
  if(t==='receipt'||t==='payment'){if(!v.accId)return'Select the party / ledger';if(!(+v.amount>0))return'Enter amount';if(+v.tds>+v.amount)return'TDS cannot exceed amount'}
  if(t==='expense'){if(!v.ledger)return'Select expense ledger';if(!(+v.amount>0))return'Enter amount'}
  if(t==='contra'){if(!(+v.amount>0))return'Enter amount';if(v.from===v.to)return'From and To must differ'}
  if(t==='journal'){const d=r2(v.lines.reduce((s,l)=>s+(+l.dr||0),0)),k=r2(v.lines.reduce((s,l)=>s+(+l.cr||0),0));if(!d||d!==k)return'Debit and credit must be equal and non-zero';if(v.lines.some(l=>(+l.dr||+l.cr)&&!l.acc))return'Select a ledger on every line'}return''}
function saveV(pr){const c=C(),v=F,err=validate(c,v);if(err){toast(err);return}const cl=JSON.parse(JSON.stringify(v));
  if(INV.includes(cl.type)){cl.lines=cl.lines.filter(l=>+l.qty*+l.rate>0).map(l=>({...l,qty:+l.qty,rate:+l.rate,disc:+l.disc||0,gst:+l.gst||0}));cl.pos=cl.pos||party(c,cl.partyId)?.state||c.state}
  if(cl.type==='journal')cl.lines=cl.lines.filter(l=>+l.dr||+l.cr).map(l=>({acc:l.acc,dr:+l.dr||0,cr:+l.cr||0}));
  ['amount','tds','gst'].forEach(k=>{if(k in cl)cl[k]=+cl[k]||0});
  if(cl.id){c.vouchers[c.vouchers.findIndex(x=>x.id===cl.id)]=cl}else{cl.id='v'+uid();c.vouchers.push(cl)}
  logAct((v.id?'Edited ':'Created ')+TYPES[cl.type].name+' '+cl.no+' ('+fmt(vTotal(c,cl))+')');const f=fyOf(cl.date);if(f!==FYS()){DB.fy=f;toast('Saved in FY '+f)}else toast('Saved');save();closeModal(FM);render();if(pr)viewV(cl.id)}

/* ===================== auth, vault & cloud sync ===================== */
const CONFIG={firm:'KRN Audit Consultancy',product:'Accounting ERP',vaultPath:'data/vault.json',idleMin:20,iter:250000};
const VKEY='krn_erp_vault_v1',DTOK='krn_erp_devtoken',RKEY='krn_erp_repo',OLDKEY='krn_billing_v1';
const te=new TextEncoder(),td=new TextDecoder();
let VAULT=null,SESSION=null,REMOTE='n/a',SYNC={sha:null},lastAct=Date.now(),persistT,pushT,loginFails=0;
const b64e=u=>{let s='';u.forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function kdf(pw,salt,iter){const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function wrapSlot(raw,pw,user){const salt=rnd(16),iv=rnd(12),key=await kdf(pw,salt,CONFIG.iter);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,raw);return{user,salt:b64e(salt),iv:b64e(iv),ct:b64e(new Uint8Array(ct)),iter:CONFIG.iter}}
async function openSlot(slot,pw){const key=await kdf(pw,b64d(slot.salt),slot.iter);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(slot.iv)},key,b64d(slot.ct)))}
const importDek=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function encData(dek,obj){const iv=rnd(12),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},dek,te.encode(JSON.stringify(obj)));return{iv:b64e(iv),ct:b64e(new Uint8Array(ct))}}
async function decData(dek,d){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(d.iv)},dek,b64d(d.ct))))}
const freshDB=n=>({v:1,active:null,fy:null,companies:{},lastExport:null,meta:{clientName:n||''},sync:{},log:[]});
function logAct(a){if(!DB||!SESSION)return;DB.log=DB.log||[];DB.log.push({t:Date.now(),u:SESSION.user,a});if(DB.log.length>800)DB.log.splice(0,DB.log.length-800)}
function setStatus(t){const e=$('#syncst');if(e)e.textContent=t;setStatus.last=t}

/* ---- GitHub contents API ---- */
const repoCoords=()=>{try{const r=JSON.parse(localStorage.getItem(RKEY));if(r&&r.owner&&r.repo)return r}catch(e){}
  if(location.hostname.endsWith('.github.io'))return{owner:location.hostname.split('.')[0],repo:location.pathname.split('/')[1]||location.hostname,branch:'main'};return null};
async function ghGet(s,token){const h={Accept:'application/vnd.github+json'};if(token)h.Authorization='Bearer '+token;
  const url=`https://api.github.com/repos/${s.owner}/${s.repo}/contents/${s.path}?ref=${encodeURIComponent(s.branch||'main')}&_=${Date.now()}`;
  const r=await fetch(url,{headers:h,cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();let text;
  if(j.content&&j.encoding==='base64')text=td.decode(b64d(j.content.replace(/\s/g,'')));else{const r2=await fetch(url,{headers:{...h,Accept:'application/vnd.github.raw+json'},cache:'no-store'});text=await r2.text()}return{sha:j.sha,text}}
async function ghPut(s,text,sha){const r=await fetch(`https://api.github.com/repos/${s.owner}/${s.repo}/contents/${s.path}`,{method:'PUT',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+s.token,'Content-Type':'application/json'},body:JSON.stringify({message:'ERP data sync '+new Date().toISOString(),content:btoa(text),branch:s.branch||'main',...(sha?{sha}:{})})});
  if(r.status===409||r.status===422){const e=new Error('conflict');e.conflict=true;throw e}if(!r.ok)throw new Error('GitHub '+r.status);return(await r.json()).content.sha}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
const canSync=()=>DB&&DB.sync&&DB.sync.token&&DB.sync.owner&&DB.sync.repo;

/* ---- persistence ---- */
function queuePersist(){clearTimeout(persistT);persistT=setTimeout(persist,300);setStatus('Saving…')}
async function persist(){if(!SESSION||!DB)return;VAULT.data=await encData(SESSION.dek,DB);VAULT.updatedAt=Date.now();VAULT.meta={client:DB.meta?.clientName||''};
  try{localStorage.setItem(VKEY,JSON.stringify(VAULT))}catch(e){toast('Could not save on this device — storage full/blocked')}setStatus('Saved on this device');if(canSync()){clearTimeout(pushT);pushT=setTimeout(pushVault,2500)}}
async function pushVault(){if(!canSync())return;const s={...DB.sync,path:CONFIG.vaultPath};setStatus('Syncing…');const text=JSON.stringify(VAULT);
  try{SYNC.sha=await ghPut(s,text,SYNC.sha);setStatus('Synced to cloud ✓')}
  catch(e){if(!e.conflict){setStatus('Cloud sync failed — '+e.message);return}
    try{const r=await ghGet(s,s.token);if(!r){SYNC.sha=await ghPut(s,text,null);setStatus('Synced to cloud ✓');return}
      const rv=JSON.parse(r.text);
      if(rv.updatedAt>VAULT.updatedAt&&confirm('Another device saved newer data to the cloud.\n\nOK = load the cloud version (this device\'s unsynced changes are downloaded as a backup first).\nCancel = overwrite the cloud with this device\'s version.')){
        download(`unsynced_backup_${today()}.json`,JSON.stringify({format:'KRN-BILLING-BACKUP',version:1,companies:DB.companies}));await adoptRemote(rv,r.sha)}
      else{SYNC.sha=await ghPut(s,text,r.sha);setStatus('Synced to cloud ✓')}}
    catch(e2){setStatus('Cloud sync failed — '+e2.message)}}}
async function adoptRemote(rv,sha){const data=await decData(SESSION.dek,rv.data);const keep=DB.sync;DB=data;DB.sync=keep;VAULT=rv;localStorage.setItem(VKEY,JSON.stringify(VAULT));SYNC.sha=sha;MC.clear();REV++;setStatus('Loaded from cloud ✓');render()}
async function pullLatest(){if(!canSync())return;try{const r=await withTimeout(ghGet({...DB.sync,path:CONFIG.vaultPath},DB.sync.token),8000);if(!r){schedPush();return}SYNC.sha=r.sha;const rv=JSON.parse(r.text);
  if(rv.updatedAt>VAULT.updatedAt){await adoptRemote(rv,r.sha);toast('Loaded latest data from cloud')}else if(rv.updatedAt<VAULT.updatedAt)schedPush();else setStatus('Synced to cloud ✓')}catch(e){setStatus('Cloud unreachable — working offline')}}
const schedPush=()=>{clearTimeout(pushT);pushT=setTimeout(pushVault,500)};
async function syncNow(){if(!canSync()){toast('Add the GitHub details first');return}await persist();await pushVault();toast($('#syncst')?.textContent||'Done')}

/* ---- boot / login / setup ---- */
async function boot(){document.body.classList.add('locked');let local=null;try{local=JSON.parse(localStorage.getItem(VKEY))}catch(e){}VAULT=local;REMOTE='n/a';
  const rc=repoCoords();if(rc){try{const r=await withTimeout(ghGet({...rc,path:CONFIG.vaultPath},localStorage.getItem(DTOK)||''),7000);if(r){const rv=JSON.parse(r.text);SYNC.sha=r.sha;if(!VAULT||rv.updatedAt>VAULT.updatedAt){VAULT=rv;localStorage.setItem(VKEY,r.text)}REMOTE='ok'}else REMOTE='none'}catch(e){REMOTE='fail'}}
  if(!location.hash)location.hash='#/dash';render()}
function authShell(inner){return`<div style="min-height:88vh;display:flex;align-items:center;justify-content:center;padding:16px"><div class="card" style="width:100%;max-width:${VAULT?'400':'620'}px;padding:28px;box-shadow:0 12px 40px rgba(20,27,52,.12)"><div style="font-size:20px;font-weight:700;color:var(--pri)">${esc(CONFIG.firm)}</div><div class="mut" style="margin-bottom:18px">${CONFIG.product}${VAULT?.meta?.client?' — '+esc(VAULT.meta.client):''}</div>${inner}</div></div>`}
const devTokField=()=>`<details style="margin-top:14px"><summary class="mut" style="cursor:pointer">Private repository? Device access token</summary><p class="mut">If this app's data repository is private, paste the read token your administrator gave you. It is kept on this device only.</p><div class="bar"><input id="dtok" placeholder="github_pat_…" value="${esc(localStorage.getItem(DTOK)||'')}"><button onclick="localStorage.setItem(DTOK,$('#dtok').value.trim());boot()">Save &amp; retry</button></div></details>`;
function drawLogin(){const m=$('#main');
  if(!VAULT){if(REMOTE==='fail'){m.innerHTML=authShell(`<p class="bad">Couldn't reach the cloud to check for existing data.</p><p class="mut">Check your internet connection and retry. (This stops a duplicate set-up from overwriting existing books.)</p><button class="pri" onclick="boot()">Retry</button>${devTokField()}`);return}m.innerHTML=setupHTML();return}
  m.innerHTML=authShell(`<form onsubmit="doLogin();return false"><div style="margin-bottom:10px"><label>Username</label><input id="lg_u" autocomplete="username" autofocus></div><div style="margin-bottom:12px"><label>Password</label><input id="lg_p" type="password" autocomplete="current-password"></div><div id="lg_e" class="bad" style="min-height:20px"></div><button class="pri" style="width:100%" type="submit">Sign in</button></form>${REMOTE==='fail'?'<p class="warn">Offline — using the copy saved on this device.</p>':''}${devTokField()}<p class="mut" style="margin:16px 0 0;font-size:12px">Your books are encrypted with your password. Nobody — including this website — can read them without it.</p>`)}
async function doLogin(){const u=$('#lg_u').value.trim().toLowerCase(),p=$('#lg_p').value,e=$('#lg_e');e.textContent='';
  const sl=VAULT.slots;let slot=null,role=null;if(u==='admin'){slot=sl.admin;role='admin'}else if(sl.client&&sl.client.user.toLowerCase()===u){slot=sl.client;role='client'}
  await new Promise(r=>setTimeout(r,Math.min(loginFails*700,6000)));
  try{if(!slot)throw 0;const raw=await openSlot(slot,p);const dek=await importDek(raw);DB=await decData(dek,VAULT.data);SESSION={user:role==='admin'?'admin':slot.user,role,dek,raw};loginFails=0;DB.sync=DB.sync||{};logAct('Signed in');
    document.body.classList.remove('locked');await pullLatest();startIdle();if(!location.hash||location.hash==='#/')location.hash='#/dash';render()}
  catch(err){loginFails++;e.textContent='Invalid username or password'}}
async function logout(auto){if(!SESSION)return;clearTimeout(persistT);logAct(auto?'Auto-locked (idle)':'Signed out');await persist();if(canSync()){clearTimeout(pushT);try{await withTimeout(pushVault(),6000)}catch(e){}}
  DB=null;SESSION=null;MC.clear();document.body.classList.add('locked');$('#modals').innerHTML='';render()}
function startIdle(){['mousemove','keydown','click','touchstart'].forEach(ev=>document.addEventListener(ev,()=>lastAct=Date.now(),{passive:true}));setInterval(()=>{if(SESSION&&Date.now()-lastAct>CONFIG.idleMin*60000)logout(true)},30000);document.addEventListener('visibilitychange',()=>{if(document.hidden&&SESSION){clearTimeout(persistT);persist()}})}
function setupHTML(){const rc=repoCoords()||{},old=(()=>{try{return!!JSON.parse(localStorage.getItem(OLDKEY)).companies}catch(e){return false}})();const f=(i,l,t='text',v='')=>`<div><label>${l}</label><input id="su_${i}" type="${t}" value="${esc(v)}"></div>`;
  return authShell(`<h2 style="margin-top:0">First-time setup for this client</h2><p class="mut">Done once by the administrator. The books are stored encrypted — passwords are never saved anywhere readable.</p>
  <div class="f">${f('client','Client / business name *')}${f('cuser','Client username *','text','client')}${f('cpw','Client password * (min 8)','password')}${f('cpw2','Confirm client password','password')}</div>
  <div class="f">${f('apw','Administrator password * (yours — opens any client\'s books)','password')}${f('apw2','Confirm administrator password','password')}</div>
  <h2>Cloud sync <span class="mut" style="font-weight:400;font-size:12px">(optional — lets the client use any device)</span></h2><div class="f">${f('owner','GitHub owner',  'text',rc.owner||'')}${f('repo','Repository','text',rc.repo||'')}${f('branch','Branch','text',rc.branch||'main')}${f('token','Fine-grained token (Contents: read & write on this repo only)','password')}</div>
  ${old?`<label style="display:flex;gap:6px;align-items:center;color:var(--ink)"><input type="checkbox" id="su_old" style="width:auto" checked> Import the books already saved in this browser (earlier version)</label>`:''}
  ${REMOTE==='none'?'<p class="mut">Cloud check: no existing data found for this repository.</p>':''}<div class="foot"><button class="pri" onclick="doSetup()">Create &amp; sign in</button></div>${devTokField()}`)}
async function doSetup(){const v=i=>$('#su_'+i).value;const name=v('client').trim(),cu=v('cuser').trim();
  if(!name||!cu){toast('Client name and username are required');return}if(cu.toLowerCase()==='admin'){toast('"admin" is reserved');return}
  if(v('cpw').length<8||v('apw').length<8){toast('Passwords need at least 8 characters');return}if(v('cpw')!==v('cpw2')||v('apw')!==v('apw2')){toast('Password confirmation does not match');return}
  const raw=rnd(32),dek=await importDek(raw);VAULT={v:1,slots:{admin:await wrapSlot(raw,v('apw'),'admin'),client:await wrapSlot(raw,v('cpw'),cu)},data:null,updatedAt:0,meta:{client:name}};
  DB=freshDB(name);if($('#su_old')?.checked){try{const o=JSON.parse(localStorage.getItem(OLDKEY));Object.assign(DB,{companies:o.companies,active:o.active,fy:o.fy,lastExport:o.lastExport})}catch(e){}}
  const ow=v('owner').trim(),rp=v('repo').trim();if(ow&&rp){DB.sync={owner:ow,repo:rp,branch:v('branch').trim()||'main',token:v('token').trim()};localStorage.setItem(RKEY,JSON.stringify({owner:ow,repo:rp,branch:DB.sync.branch}))}
  SESSION={user:'admin',role:'admin',dek,raw};logAct('Client workspace created');document.body.classList.remove('locked');await persist();if(canSync())await pushVault();startIdle();location.hash='#/dash';render();toast('Workspace created — share the client username and password with your client')}

function accessCards(){if(!SESSION)return'';const adm=SESSION.role==='admin',s=DB.sync||{};

const GTAB=[['sum','GSTR-3B summary'],['b2b','GSTR-1 · B2B'],['b2c','GSTR-1 · B2C'],['cdn','GSTR-1 · Credit notes'],['hsn','HSN summary'],['docs','Documents issued'],['reg','Sales register'],['purch','Purchase / ITC register']];
PAGES.gst=c=>{if(!c.gstReg)return`<h1>GST Reports</h1><div class="card">This company is marked <b>not GST registered</b>, so bills carry no GST. Enable it in <a href="#/settings">Settings</a> (set “GST registered?” = Yes and add the GSTIN).</div>`;
  const fy=FYS(),ms=monthsOf(fy);if(G.per!=='FY'&&!ms.some(m=>m.key===G.per))G.per='FY';const r=G.per==='FY'?fyRange(fy):monthRange(G.per),t=gstTabs(c,r.start,r.end),cur=t[G.tab],name=GTAB.find(x=>x[0]===G.tab)[1];
  CUR={title:name,aoa:G.tab==='sum'?t.sum.aoa:[cur.head,...cur.rows]};
  return`<h1>GST Reports</h1><div class="bar noprint"><select onchange="G.per=this.value;render()"><option value="FY"${G.per==='FY'?' selected':''}>Full FY ${fy}</option>${ms.map(m=>`<option value="${m.key}"${G.per===m.key?' selected':''}>${m.label}</option>`).join('')}</select>${toolbar(`<button onclick="exportGstAll()">Export all tabs</button>`)}</div>
  <div class="tabs noprint">${GTAB.map(([k,n])=>`<button class="${G.tab===k?'on':''}" onclick="G.tab='${k}';render()">${n}</button>`).join('')}</div>${hdrLine(c,name,dmy(r.start)+' to '+dmy(r.end))}${G.tab==='sum'?t.sum.html:gtbl(cur.head,cur.rows,cur.sum||[])}`};
function exportGstAll(){const c=C(),fy=FYS(),r=G.per==='FY'?fyRange(fy):monthRange(G.per),t=gstTabs(c,r.start,r.end);exportSheets('GST '+c.name+' '+(G.per==='FY'?fy:G.per),GTAB.map(([k,n])=>({name:n.replace('·','-'),aoa:k==='sum'?t.sum.aoa:[t[k].head,...t[k].rows]})))}

/* ===================== dashboard ===================== */
PAGES.dash=c=>{const fy=FYS(),pl=PL(c,fy),tb=TB(c,fy),sum=g=>r2(c.accounts.filter(a=>a.group===g).reduce((s,a)=>s+tb[a.id].close,0));
  const rec=outstanding(c,fy,'dr').rows.reduce((s,r)=>s+r.total,0),pay=outstanding(c,fy,'cr').rows.reduce((s,r)=>s+r.total,0),cash=r2(sum('Cash-in-Hand')+sum('Bank Accounts'));
  const ms=monthsOf(fy),mS={},mP={};c.vouchers.forEach(v=>{const k=v.date.slice(0,7);if(v.type==='sales')mS[k]=(mS[k]||0)+calc(c,v).taxable;else if(v.type==='purchase')mP[k]=(mP[k]||0)+calc(c,v).taxable});
  const mx=Math.max(1,...ms.map(m=>Math.max(mS[m.key]||0,mP[m.key]||0)));
  let gst='';if(c.gstReg){const cm=today().slice(0,7),k=ms.some(m=>m.key===cm)?cm:ms[11].key,r=monthRange(k),s=gstr3b(c,r.start,r.end);gst=`<div class="kpi"><span>GST payable — ${ms.find(m=>m.key===k).label}</span><b class="${s.net.total>0?'warn':'ok'}">₹${fmt(s.net.total)}</b></div>`}
  const old=!DB.lastExport||(Date.now()-DB.lastExport)>7*864e5;
  const recent=[...c.vouchers].sort((a,b)=>a.date<b.date?1:-1).slice(0,8);
  return`<h1>Dashboard <span class="mut" style="font-size:13px;font-weight:400">${esc(c.name)} · FY ${fy}</span></h1>${old&&c.vouchers.length?`<div class="warnbox">Your data lives in this browser only. <a onclick="go('data')" style="cursor:pointer;color:var(--pri)">Export a backup</a> ${DB.lastExport?'(last: '+new Date(DB.lastExport).toLocaleDateString()+')':''}.</div>`:''}
  <div class="bar"><button class="pri" onclick="openVoucher('sales')">+ Sales Invoice</button><button onclick="openVoucher('purchase')">+ Purchase</button><button onclick="openVoucher('receipt')">+ Receipt</button><button onclick="openVoucher('payment')">+ Payment</button><button onclick="openVoucher('expense')">+ Expense</button></div>
  <div class="grid g4"><div class="kpi"><span>Net sales</span><b>₹${fmt(pl.tSales)}</b></div><div class="kpi"><span>Net purchases</span><b>₹${fmt(pl.tPurch)}</b></div><div class="kpi"><span>Net ${pl.np<0?'loss':'profit'} (this FY)</span><b class="${pl.np<0?'bad':'ok'}">₹${fmt(Math.abs(pl.np))}</b></div>
  <div class="kpi"><span>Receivables</span><b>₹${fmt(rec)}</b></div><div class="kpi"><span>Payables</span><b>₹${fmt(pay)}</b></div><div class="kpi"><span>Cash + Bank</span><b>₹${fmt(cash)}</b></div>${gst}</div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><b>Monthly sales vs purchases</b> <span class="mut">(taxable)</span><div class="bars">${ms.map(m=>`<div><div class="pair"><i style="height:${(mS[m.key]||0)/mx*100}%;background:var(--pri)" title="Sales ${fmt(mS[m.key]||0)}"></i><i style="height:${(mP[m.key]||0)/mx*100}%;background:#e0a526" title="Purchases ${fmt(mP[m.key]||0)}"></i></div>${m.label.slice(0,3)}</div>`).join('')}</div><span class="tag">■ Sales</span> <span class="tag y">■ Purchases</span></div>
  <div class="card"><b>Recent entries</b><table style="margin-top:6px"><tbody>${recent.map(v=>`<tr><td>${dmy(v.date)}</td><td><span class="tag">${TYPES[v.type].name}</span></td><td>${esc(vParty(c,v))}</td><td class="n">${fmt(vTotal(c,v))}</td></tr>`).join('')||'<tr><td class="empty">No entries yet. Add parties, then create your first invoice.</td></tr>'}</tbody></table></div></div>`};
/* ===================== export / import ===================== */
function plbsObject(c,fy){const pl=PL(c,fy),bs=BS(c,fy),tb=TB(c,fy),r=fyRange(fy);
  const nm=a=>a.map(x=>({ledger:x.name,amount:x.amt}));
  const sec=(side,key)=>{const arr=bs[side].filter(s=>s.key===key);return{total:r2(arr.reduce((s,x)=>s+x.total,0)),items:arr.flatMap(s=>s.items.map(i=>({ledger:i.name,amount:i.amt})))}};
  const cap=sec('L','Capital Account'),pp=priorProfit(c,fy);
  const figures={sales:pl.tSales,purchases:pl.tPurch,directExpenses:pl.tDexp,indirectExpenses:pl.tIexp,indirectIncome:pl.tIinc,openingStock:pl.open,closingStock:pl.close,grossProfit:pl.gp,netProfit:pl.np,
    capital:cap.total,profitBroughtForward:pp,loans:sec('L','Loans (Liability)').total,currentLiabilities:sec('L','Current Liabilities').total,sundryCreditors:sec('L','Sundry Creditors').total,gstAndDutiesPayable:sec('L','Duties & Taxes').total,
    fixedAssets:sec('A','Fixed Assets').total,investments:sec('A','Investments').total,sundryDebtors:sec('A','Sundry Debtors').total,cashAndBank:sec('A','Cash & Bank').total,otherCurrentAssets:sec('A','Current Assets').total,gstInputCredit:sec('A','Duties & Taxes').total,
    openingBalanceDifference:bs.diff,totalLiabilities:bs.tL,totalAssets:bs.tA};
  return{format:'KRN-PLBS-IMPORT',version:1,source:'KRN Audit Consultancy – Accounting ERP',exportedAt:new Date().toISOString(),
   client:{name:c.name,entityType:c.type,pan:c.pan,gstin:c.gstin,address:c.address,state:STATES[c.state]||'',gstRegistered:c.gstReg},
   financialYear:fy,periodStart:r.start,periodEnd:r.end,figures,
   tradingAccount:{openingStock:pl.open,purchases:nm(pl.purch),directExpenses:nm(pl.dexp),sales:nm(pl.sales),closingStock:pl.close,grossProfit:pl.gp},
   profitAndLoss:{indirectIncomes:nm(pl.iinc),indirectExpenses:nm(pl.iexp),netProfit:pl.np},
   balanceSheet:{liabilities:bs.L.map(s=>({group:s.label,total:s.total,items:s.items.map(i=>({ledger:i.name,amount:i.amt}))})),assets:bs.A.map(s=>({group:s.label,total:s.total,items:s.items.map(i=>({ledger:i.name,amount:i.amt}))})),totalLiabilities:bs.tL,totalAssets:bs.tA},
   trialBalance:Object.values(tb).filter(t=>t.open||t.dr||t.cr).map(t=>({ledger:t.a.name,group:t.a.group,opening:t.open,debit:t.dr,credit:t.cr,closing:t.close,closingType:t.close>=0?'Dr':'Cr'}))}}
const safe=s=>String(s).replace(/[^\w\-]+/g,'_');
function exportPLBS(){const c=C(),o=plbsObject(c,FYS());download(`PLBS_${safe(c.name)}_${FYS()}.json`,JSON.stringify(o,null,2));DB.lastExport=Date.now();save();toast('PL-BS file exported')}
function exportBackup(all){const o={format:'KRN-BILLING-BACKUP',version:1,exportedAt:new Date().toISOString(),companies:all?DB.companies:{[C().id]:C()}};download(`KRN_Billing_backup_${all?'all':safe(C().name)}_${today()}.json`,JSON.stringify(o));DB.lastExport=Date.now();save();toast('Backup exported');render()}
function exportWorkbook(){const c=C(),sv={...FLT},ok=OUT.kind;FLT.q='';FLT.m='';const sh=[];
  [['tb','Trial Balance'],['pl','Trading & P&L'],['bs','Balance Sheet'],['sales','Sales'],['purchase','Purchases'],['receipt','Receipts'],['payment','Payments'],['expense','Expenses'],['cn','Credit Notes'],['dn','Debit Notes'],['parties','Parties']].forEach(([k,n])=>{PAGES[k](c);sh.push({name:n,aoa:CUR.aoa})});
  ['dr','cr'].forEach(k=>{OUT.kind=k;PAGES.outstanding(c);sh.push({name:k==='dr'?'Receivables':'Payables',aoa:CUR.aoa})});
  if(c.gstReg){const t=gstTabs(c,fyRange(FYS()).start,fyRange(FYS()).end);GTAB.forEach(([k,n])=>sh.push({name:'GST '+n.replace('·','-'),aoa:k==='sum'?t.sum.aoa:[t[k].head,...t[k].rows]}))}
  Object.assign(FLT,sv);OUT.kind=ok;exportSheets(`Reports_${safe(c.name)}_${FYS()}`,sh);DB.lastExport=Date.now();save()}
function importBackup(text){let o;try{o=JSON.parse(text)}catch(e){toast('Not a valid JSON file');return}
  if(o.format!=='KRN-BILLING-BACKUP'||!o.companies){toast(o.format==='KRN-PLBS-IMPORT'?'This is a PL-BS export file — import it in the PL-BS module':'Unrecognised backup file');return}
  let add=0,rep=0;for(const[id,c]of Object.entries(o.companies)){if(!c.accounts||!c.vouchers)continue;if(DB.companies[id]){if(!confirm(`"${DB.companies[id].name}" already exists. Replace it with the backup copy?`))continue;rep++}else add++;DB.companies[id]=c}
  logAct('Restored backup');if(!DB.active||!DB.companies[DB.active])DB.active=Object.keys(DB.companies)[0];const c=C();if(c&&(!DB.fy||DB.fy<c.firstFY))DB.fy=fyOf(today())<c.firstFY?c.firstFY:fyOf(today());save();render();toast(`Imported: ${add} new, ${rep} replaced`)}
function pickImport(kind){const i=document.createElement('input');i.type='file';i.accept=kind==='backup'?'.json,application/json':'.xlsx,.xls,.csv';i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();
  if(kind==='backup'){rd.onload=()=>importBackup(rd.result);rd.readAsText(f)}
  else{if(!window.XLSX){toast('Excel library not loaded (check internet)');return}rd.onload=()=>{try{const wb=XLSX.read(rd.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});kind==='parties'?impParties(rows):impItems(rows)}catch(e){toast('Could not read file: '+e.message)}};rd.readAsArrayBuffer(f)}};i.click()}
const normRow=r=>{const o={};for(const k in r)o[k.toLowerCase().replace(/[^a-z0-9]/g,'')]=typeof r[k]==='string'?r[k].trim():r[k];return o};
function impParties(rows){const c=C();let n=0,sk=0;rows.map(normRow).forEach(r=>{const name=String(r.name||r.partyname||'').trim();if(!name)return;if(c.parties.some(p=>p.name.toLowerCase()===name.toLowerCase())){sk++;return}
  const gstin=String(r.gstin||'').toUpperCase(),type=/sup|cred|vend/i.test(r.type||'')?'supplier':'customer';let st=c.state;const sc=String(r.state||'');
  if(STATES[gstin.slice(0,2)])st=gstin.slice(0,2);else if(STATES[sc.padStart(2,'0')])st=sc.padStart(2,'0');else{const f=Object.entries(STATES).find(([k,v])=>v.toLowerCase()===sc.toLowerCase());if(f)st=f[0]}
  const id='p'+uid();c.parties.push({id,type,name,gstin,pan:String(r.pan||gstin.slice(2,12)||'').toUpperCase(),state:st,phone:String(r.phone||r.mobile||''),email:String(r.email||''),address:String(r.address||'')});
  const ot=/cr/i.test(r.openingtype||r.drcr||'')?'Cr':/dr/i.test(r.openingtype||r.drcr||'')?'Dr':(type==='supplier'?'Cr':'Dr');
  c.accounts.push({id,name,group:type==='supplier'?'Sundry Creditors':'Sundry Debtors',opening:Math.abs(+r.opening||+r.openingbalance||0),ot,party:1});n++});
  save();render();toast(`Imported ${n} parties${sk?`, skipped ${sk} existing`:''}`)}
function impItems(rows){const c=C();let n=0;rows.map(normRow).forEach(r=>{const name=String(r.name||r.item||'').trim();if(!name||c.items.some(i=>i.name.toLowerCase()===name.toLowerCase()))return;
  c.items.push({id:'i'+uid(),name,type:/good/i.test(r.type||'')?'Goods':'Service',hsn:String(r.hsn||r.sac||r.hsnsac||''),unit:String(r.unit||''),rate:+r.rate||0,gst:r.gst===''||r.gst===undefined?18:+r.gst});n++});save();render();toast(`Imported ${n} items`)}
const partyTemplate=()=>exportSheets('Parties_template',[{name:'Parties',aoa:[['Name','Type','GSTIN','PAN','State','Phone','Email','Address','Opening','Dr/Cr'],['Sample Customer','Customer','33ABCDE1234F1Z5','ABCDE1234F','Tamil Nadu','9999999999','a@b.com','Chennai',10000,'Dr']]}]);
const itemTemplate=()=>exportSheets('Items_template',[{name:'Items',aoa:[['Name','Type','HSN/SAC','Unit','Rate','GST %'],['Tax consultancy fee','Service','998231','Nos',5000,18]]}]);

PAGES.data=c=>{const fy=FYS(),o=plbsObject(c,fy),f=o.figures,row=(a,b)=>`<tr><td>${a}</td><td class="n">${fmt(b)}</td></tr>`;
  return`<h1>Export / Import</h1>
  <div class="warnbox"><b>Where is my data?</b> Everything is saved in <i>this browser on this device</i> (localStorage). Clearing site data or switching browsers loses it — export a backup regularly.</div>
  <div class="grid g2"><div class="card"><h2 style="margin-top:0">Export for KRN PL-BS module</h2><p class="mut">One JSON file for <b>${esc(c.name)}</b>, FY ${fy}: trading account, P&amp;L, balance sheet (with ledger-wise details), closing balances and trial balance.</p>
   <button class="pri" onclick="exportPLBS()">Download PL-BS file (.json)</button><table style="margin-top:12px"><tbody>${row('Net sales',f.sales)}${row('Net purchases',f.purchases)}${row('Closing stock',f.closingStock)}${row('Net profit / (loss)',f.netProfit)}${row('Capital',f.capital)}${row('Sundry debtors',f.sundryDebtors)}${row('Sundry creditors',f.sundryCreditors)}${row('Cash &amp; bank',f.cashAndBank)}${row('Total assets',f.totalAssets)}</tbody></table></div>
  <div class="card"><h2 style="margin-top:0">Export reports (Excel)</h2><p class="mut">Workbook with Trial Balance, P&amp;L, Balance Sheet, registers, outstanding, parties and GST tabs for FY ${fy}.</p><button class="pri" onclick="exportWorkbook()">Download Excel workbook</button>
   <h2>Backup (JSON)</h2><p class="mut">Full data, restorable on any device.</p><div class="bar"><button onclick="exportBackup(false)">This company</button><button onclick="exportBackup(true)">All companies</button></div><p class="mut">Last export: ${DB.lastExport?new Date(DB.lastExport).toLocaleString():'never'}</p></div></div>
  <div class="card"><h2 style="margin-top:0">Import</h2><div class="bar"><button class="pri" onclick="pickImport('backup')">Restore backup (.json)</button><button onclick="pickImport('parties')">Import parties (Excel/CSV)</button><button onclick="partyTemplate()">Parties template</button><button onclick="pickImport('items')">Import items (Excel/CSV)</button><button onclick="itemTemplate()">Items template</button></div>
  <p class="mut">Restoring a backup adds companies that don't exist yet and asks before replacing ones that do.</p></div>`};

/* ===================== init ===================== */
boot();
</script></body></html>
